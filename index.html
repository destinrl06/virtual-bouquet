<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Bouquet for Someone Special</title>
    <link rel="stylesheet" href="css/landing.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Lora:ital,wght@0,500;1,400;600;700&family=Playfair+Display:ital,wght@1,600;1,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="landing-shell">
        <section class="hero-container landing-card" aria-labelledby="landing-title">
            <div class="hero-text">
                <div class="bouquet-icon" aria-hidden="true"></div>
                <h1 id="landing-title">Virtual Bouquet for Someone Special</h1>
                <p class="landing-description">Rangkai bunga favoritmu, selipkan pesan hangat dari hati, dan kirimkan ke orang tersayang.</p>
                <div class="hero-actions">
                    <a href="builder.html" class="btn-build">Build Bouquet</a>
                    <a href="message.html" class="btn-secret">Kirim Pesan Rahasia</a>
                    <a href="unek.html" class="btn-secret">Ruang Unek-Unek</a>
                </div>
            </div>
            <div class="hero-preview">
                <div class="flower-showcase" aria-label="Pilihan bunga">
                <figure class="flower-preview flower-item">
                    <div class="flower-thumb"><img src="assets/flowers/rose.png" alt="Rose"></div>
                    <figcaption>Rose</figcaption>
                </figure>
                <figure class="flower-preview flower-item">
                    <div class="flower-thumb"><img src="assets/flowers/alcea.png" alt="Alcea"></div>
                    <figcaption>Alcea</figcaption>
                </figure>
                <figure class="flower-preview flower-item">
                    <div class="flower-thumb"><img src="assets/flowers/garbera.png" alt="Gerbera"></div>
                    <figcaption>Gerbera</figcaption>
                </figure>
                <figure class="flower-preview flower-item">
                    <div class="flower-thumb"><img src="assets/flowers/plumeria.png" alt="Plumeria"></div>
                    <figcaption>Plumeria</figcaption>
                </figure>
                <figure class="flower-preview flower-item">
                    <div class="flower-thumb"><img src="assets/flowers/narcissus.png" alt="Narcissus"></div>
                    <figcaption>Narcissus</figcaption>
                </figure>
                <figure class="flower-preview flower-item">
                    <div class="flower-thumb"><img src="assets/flowers/marigold.png" alt="Marigold"></div>
                    <figcaption>Marigold</figcaption>
                </figure>
                </div>
                <p class="cta-text">Yuk rangkai bunganya dan jangan lupa kasih pesan manisnya!</p>
            </div>
        </section>
    </main>
    <footer class="landing-footer">
        <p class="watermark">made with love by desnur • 2026</p>
    </footer>
</body>
</html>
